[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuwa-build"
version = "0.5.0"
description = "Build and publish Nim extensions for Python with zero configuration."
readme = "README.md"
authors = [{ name = "Martin Eastwood", email = "martin.eastwood@gmx.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "packaging >= 23.0",
    "pyproject-metadata >= 0.12.1, < 0.13",
    "tomli >= 1.2.0 ; python_version < '3.11'",
    "wheel >= 0.40.0",
]

[project.optional-dependencies]
notebook = ["ipython >= 7.0.0"]
watch = ["watchdog >= 5.0.0"]
test = [
    "ipython >= 7.0.0",
    "pytest >= 7.0.0, < 8.0.0",
    "pytest-cov >= 4.0.0, < 7.0.0",
    "watchdog >= 5.0.0",
]
dev = [
    "mypy >= 1.0.0",
    "pre-commit >= 4.0.0",
    "ruff >= 0.1.0",
    "shtab >= 1.7.0",
]

[project.urls]
Homepage = "https://github.com/martineastwood/nuwa-build"
Documentation = "https://martineastwood.github.io/nuwa-docs/"
Repository = "https://github.com/martineastwood/nuwa-build"
Issues = "https://github.com/martineastwood/nuwa-build/issues"
Changelog = "https://github.com/martineastwood/nuwa-build/blob/main/CHANGELOG.md"

[project.scripts]
# This registers the 'nuwa' command in your terminal
nuwa = "nuwa_build.cli:main"

[project.entry-points."distutils.commands"]
# This helps other tools recognize nuwa (optional polish)
nuwa_build = "nuwa_build.backend"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."
addopts = "-v"
markers = [
    "integration: marks tests as integration tests (slow, require Nim compiler)",
]
