name: Setup Nim
description: Install the pinned Nim toolchain

inputs:
  nim-version:
    required: false
    default: "2.2.10"

runs:
  using: composite
  steps:
    - name: Install Nim
      shell: bash
      env:
        NIM_VERSION: ${{ inputs.nim-version }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Windows" ]; then
          choco install nim --version "$NIM_VERSION" -y
          echo "C:\tools\Nim\nim-$NIM_VERSION\bin" >> "$GITHUB_PATH"
          echo "C:\Users\runneradmin\.nimble\bin" >> "$GITHUB_PATH"
          exit 0
        fi

        case "$RUNNER_OS-$(uname -m)" in
          Linux-x86_64) archive="nim-$NIM_VERSION-linux_x64.tar.xz" ;;
          Linux-aarch64|Linux-arm64) archive="nim-$NIM_VERSION-linux_arm64.tar.xz" ;;
          macOS-arm64) archive="nim-$NIM_VERSION-macosx_arm64.tar.xz" ;;
          macOS-x86_64) archive="nim-$NIM_VERSION-macosx_x64.tar.xz" ;;
          *) echo "Unsupported platform: $RUNNER_OS $(uname -m)" >&2; exit 1 ;;
        esac

        install_dir="$RUNNER_TEMP/nuwa-nim"
        mkdir -p "$install_dir"
        cd "$install_dir"
        curl -fsSLO "https://nim-lang.org/download/$archive"
        curl -fsSLO "https://nim-lang.org/download/$archive.sha256"
        if [ "$RUNNER_OS" = "macOS" ]; then
          shasum -a 256 -c "$archive.sha256"
        else
          sha256sum --check "$archive.sha256"
        fi
        tar -xf "$archive"
        echo "$install_dir/nim-$NIM_VERSION/bin" >> "$GITHUB_PATH"

    - name: Verify Nim
      shell: bash
      run: |
        nim --version
        nimble --version
